plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mythicgames.shrikrishnadivinearmy'
    compileSdk 34

    defaultConfig {
        applicationId "com.mythicgames.shrikrishnadivinearmy"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
}

dependencies {
    // Pure standalone Android - no external dependencies required!
}
